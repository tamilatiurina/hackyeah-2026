name: CI
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      # workspace: cli + packages
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/cli packages
      - run: uv run pytest

      # api: standalone project with its own uv.lock
      - name: API tests
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
  # Apply new Supabase migrations to the hosted project, only from main and only after the
  # Python and API tests pass. `db push` applies just the migrations the database hasn't seen,
  # so a push with no new migration does nothing.
  # Needs repository secrets: SUPABASE_ACCESS_TOKEN (personal access token),
  # SUPABASE_PROJECT_ID (project ref) and SUPABASE_DB_PASSWORD (database password).
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: python
    runs-on: ubuntu-latest
    concurrency: { group: supabase-migrations, cancel-in-progress: false }
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.119.0 } # same CLI as `make supabase`
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --workdir apps/api
      # --include-all: migrations from parallel branches can land with an older timestamp than one
      # already applied; apply them too instead of refusing the whole push.
      - run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD" --workdir apps/api

  landing:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/landing } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/landing/package.json
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/landing/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
