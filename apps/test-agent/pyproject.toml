[project]
name = "acme-test-agent"
version = "0.1.0"
description = "Deterministic stateless chat agent for testing the guarded proxy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
acme-test-agent = "acme_test_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
