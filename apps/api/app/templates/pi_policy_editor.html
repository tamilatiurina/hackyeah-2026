<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pi policy editor</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #171a23; --border: #2a2f3d;
      --text: #e6e8ee; --muted: #8b91a3; --accent: #5b9dff;
      --ok: #3ecf8e; --err: #ff6b6b; --warn: #f5b356;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .path { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
    header .spacer { flex: 1; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
    .meta {
      display: flex; gap: 24px; flex-wrap: wrap; color: var(--muted);
      font-family: ui-monospace, monospace; font-size: 12px; margin-bottom: 12px;
    }
    .meta b { color: var(--text); font-weight: 600; }
    textarea#editor {
      width: 100%; height: 60vh; min-height: 420px;
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px; line-height: 1.55; resize: vertical; outline: none; tab-size: 2;
    }
    textarea#editor:focus { border-color: var(--accent); }
    .toolbar { display: flex; gap: 8px; margin: 12px 0; align-items: center; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 6px;
      padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { margin-left: auto; font-size: 13px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .status.warn { color: var(--warn); }
    .banner {
      padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; display: none;
      font-size: 13px; white-space: pre-wrap;
    }
    .banner.err { display: block; background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.4); }
    .banner.ok { display: block; background: rgba(62,207,142,.08); border: 1px solid rgba(62,207,142,.35); }
    .banner table { border-collapse: collapse; width: 100%; }
    .banner td { padding: 2px 12px 2px 0; vertical-align: top; }
    .banner td:first-child { color: var(--err); font-family: ui-monospace, monospace; white-space: nowrap; }
    section.backups { margin-top: 32px; }
    section.backups h2 { font-size: 14px; color: var(--muted); font-weight: 600; }
    .backups table { width: 100%; border-collapse: collapse; }
    .backups td, .backups th { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .backups th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .backups td.id { font-family: ui-monospace, monospace; }
    .backups button { padding: 4px 12px; font-size: 12px; }
    .empty { color: var(--muted); padding: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>pi policy editor</h1>
    <span class="path" id="policy-path"></span>
    <span class="spacer"></span>
    <a href="/docs" style="color:var(--muted);font-size:13px">API docs</a>
  </header>
  <main>
    <div class="meta">
      <span>sha256 <b id="meta-hash" title="used for If-Match concurrency guard">—</b></span>
      <span>modified <b id="meta-modified">—</b></span>
      <span>size <b id="meta-size">—</b></span>
    </div>
    <div class="banner" id="banner"></div>
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="toolbar">
      <button id="btn-save" disabled>Save</button>
      <button id="btn-validate" class="secondary" disabled>Validate</button>
      <button id="btn-reload" class="secondary" disabled>Reload</button>
      <span class="status" id="status"></span>
    </div>

    <section class="backups">
      <h2>Backups</h2>
      <table id="backups-table" style="display:none">
        <thead><tr><th>id</th><th>saved</th><th>size</th><th></th></tr></thead>
        <tbody id="backups-body"></tbody>
      </table>
      <div class="empty" id="backups-empty">No backups yet — one is created on every save.</div>
    </section>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const editor = $("editor");
  let etag = null; // current sha256, sent back as If-Match on save

  function banner(kind, html) {
    const b = $("banner");
    b.className = "banner " + kind;
    b.innerHTML = html;
  }
  function status(kind, text) {
    const s = $("status");
    s.className = "status " + kind;
    s.textContent = text;
  }
  function setMeta(m) {
    $("policy-path").textContent = m.path;
    $("meta-hash").textContent = m.sha256 ? m.sha256.slice(0, 12) + "…" : "—";
    $("meta-modified").textContent = m.lastModifiedUtc ? m.lastModifiedUtc.replace("T", " ") : "—";
    $("meta-size").textContent = m.sizeBytes != null ? m.sizeBytes + " B" : "—";
  }
  function enableButtons() {
    for (const id of ["btn-save", "btn-validate", "btn-reload"]) $(id).disabled = false;
  }

  async function load() {
    try {
      const res = await fetch("/api/v1/pi/policy");
      if (res.status === 404) {
        banner("err", "Policy file not found on disk. Save once to create it.");
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      const body = await res.json();
      editor.value = JSON.stringify(body.policy, null, 2);
      etag = res.headers.get("ETag");
      setMeta(body);
      banner("ok", "Loaded.");
      enableButtons();
      loadBackups();
    } catch (e) {
      banner("err", "Failed to load policy: " + e.message);
    }
  }

  async function validate(showResult) {
    status("warn", "validating…");
    try {
      const body = { policy: JSON.parse(editor.value) };
      const res = await fetch("/api/v1/pi/policy/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const result = await res.json();
      if (!res.ok) { banner("err", result.detail?.message || result.detail || "Validation request failed"); return false; }
      if (showResult) {
        if (result.valid) banner("ok", "✓ Policy is valid.");
        else {
          const rows = result.errors.map(e => `<tr><td>${e.jsonPath}</td><td>${e.message}</td></tr>`).join("");
          banner("err", `<table>${rows}</table>`);
        }
      }
      return result.valid;
    } catch (e) {
      if (e instanceof SyntaxError) banner("err", "Editor content is not valid JSON: " + e.message);
      else banner("err", "Validation request failed: " + e.message);
      return false;
    }
  }

  async function save() {
    if (!(await validate(false))) { status("err", "not saved — fix errors above"); await validate(true); return; }
    status("warn", "saving…");
    const headers = { "Content-Type": "application/json" };
    if (etag) headers["If-Match"] = etag;
    try {
      const res = await fetch("/api/v1/pi/policy", {
        method: "PUT", headers,
        body: JSON.stringify({ policy: JSON.parse(editor.value) }),
      });
      const body = await res.json();
      if (res.status === 412) {
        banner("err", "Policy changed on disk since you loaded it (someone else saved).\nReloading the latest version now — re-apply your changes and save again.");
        await load();
        return;
      }
      if (res.status === 422) {
        const rows = (body.detail?.errors || []).map(e => `<tr><td>${e.jsonPath}</td><td>${e.message}</td></tr>`).join("");
        banner("err", `Policy rejected by schema:\n<table>${rows}</table>`);
        status("err", "not saved");
        return;
      }
      if (!res.ok) { banner("err", body.detail?.message || body.detail || "HTTP " + res.status); return; }
      etag = res.headers.get("ETag");
      setMeta(body);
      banner("ok", "✓ Saved atomically. The pi extension will pick it up on its next read.");
      status("ok", "saved");
      loadBackups();
    } catch (e) {
      banner("err", "Save failed: " + e.message);
    }
  }

  async function loadBackups() {
    try {
      const res = await fetch("/api/v1/pi/policy/backups");
      const backups = await res.json();
      $("backups-empty").style.display = backups.length ? "none" : "block";
      $("backups-table").style.display = backups.length ? "table" : "none";
      $("backups-body").innerHTML = backups.map(b => `
        <tr>
          <td class="id">${b.id}</td>
          <td>${(b.lastModifiedUtc || "").replace("T", " ")}</td>
          <td>${b.sizeBytes} B</td>
          <td><button class="secondary" onclick="restore('${b.id}')">Restore</button></td>
        </tr>`).join("");
    } catch (e) { /* non-fatal */ }
  }

  async function restore(id) {
    if (!confirm(`Restore backup ${id}? The current file is backed up first.`)) return;
    try {
      const res = await fetch(`/api/v1/pi/policy/backups/${id}/restore`, { method: "POST" });
      const body = await res.json();
      if (!res.ok) { banner("err", body.detail?.message || body.detail || "Restore failed"); return; }
      banner("ok", `✓ Restored from ${id}.`);
      await load();
    } catch (e) {
      banner("err", "Restore failed: " + e.message);
    }
  }

  $("btn-save").onclick = save;
  $("btn-validate").onclick = () => validate(true);
  $("btn-reload").onclick = load;
  editor.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
  });

  load();
</script>
</body>
</html>
