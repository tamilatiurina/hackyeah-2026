[project]
name = "vercel-fastapi-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.121.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.4",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.2.4",
  "regex>=2026.9.29",
  "supabase>=2.32.0",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
